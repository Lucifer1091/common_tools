name: common_tools
description: "A new Flutter package project."
version: 0.0.1
homepage: https://github.com/Lucifer1091/common_tools

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: ">=1.17.0"

dependencies:

  #--- UI packages ---#
  pinput: ^5.0.0
  dotted_border: ^2.1.0
  flutter_inset_box_shadow: ^1.0.8

  #--- Form packages ---#
  form_field_validator: ^1.1.0
  flutter_form_builder: ^9.3.0

  #--- Logic packages ---#
  intl: ^0.19.0
  encrypt: ^5.0.3

  #--- Http packages ---#
  dio: ^5.5.0+1

  #--- Hardware packages ---#
  local_auth: ^2.2.0 # biometric authentication
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  mobile_scanner: ^5.1.1
  path: ^1.9.0

  #--- Misc packages ---#
  logger: ^2.4.0

  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0