name: common_tools
description: "A new Flutter package project."
version: 0.0.1
homepage: https://github.com/Lucifer1091/common_tools

environment:
  sdk: '>=3.7.2 <4.0.0'
  flutter: ">=1.17.0"

dependencies:

  #--- UI packages ---#
  pinput: ^5.0.1
  dotted_border: ^2.1.0
  flutter_inset_box_shadow: ^1.0.8
  cached_network_image: ^3.4.1
  cached_network_image_platform_interface: ^4.1.1
  flutter_svg: ^2.2.0
  
  #--- Form packages ---#
  form_field_validator: ^1.1.0
  flutter_form_builder: ^10.0.1

  #--- Logic packages ---#
  intl: ^0.20.2
  encrypt: ^5.0.3

  #--- Http packages ---#
  dio: ^5.8.0+1

  #--- Hardware packages ---#
  local_auth: ^2.3.0 # biometric authentication
  image_picker: ^1.1.2
  file_picker: ^10.1.2
  mime: ^2.0.0
  mobile_scanner: ^6.0.10
  path: ^1.9.1

  #--- Misc packages ---#
  logger: ^2.5.0

  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0