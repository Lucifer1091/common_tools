        - asset: lib/fonts/geist_mono/GeistMono-ExtraBoldItalic.otf
          weight: 800
          style: italic
        - asset: lib/fonts/geist_mono/GeistMono-Black.otf
          weight: 900
        - asset: lib/fonts/geist_mono/GeistMono-BlackItalic.otf
          weight: 900
          style: italic
