include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Increase the severity of the unused_import hint to ensure all imports are necessary.
    unused_import: warning

    # Ignore inference failures on untyped parameters named '_', awaiting a functional fix.
    # See: https://github.com/dart-lang/language/pull/599
    inference_failure_on_untyped_parameter: ignore

    # Ignore avoid_renaming_method_parameters as it conflicts with analyzer style.
    # See: https://github.com/dart-lang/sdk/issues/48784
    avoid_renaming_method_parameters: ignore

    # Ignore constant_identifier_names to allow flexibility in naming conventions.
    constant_identifier_names: ignore

    # Ignore hash_and_equals to avoid requiring custom hashCode and equals methods.
    hash_and_equals: ignore

    # Ignore non_constant_identifier_names to allow flexibility in naming conventions.
    non_constant_identifier_names: ignore

    # Ignore implementation_imports due to tight integration with '_fe_analyzer_shared' package.
    implementation_imports: ignore

    # Ignore library_private_types_in_public_api to allow private types in public APIs.
    library_private_types_in_public_api: ignore

    # Ignore provide_deprecation_message to avoid requiring deprecation messages.
    provide_deprecation_message: ignore

    # Ignore close_sinks to avoid requiring explicit sink closures.
    close_sinks: ignore

    # Treat record literals with one positional without a trailing comma as an error for consistency.
    record_literal_one_positional_no_trailing_comma: error

    # Warn about collection method calls on unrelated types to prevent runtime errors.
    collection_methods_unrelated_type: warning

    # Warn about equality checks on unrelated types to ensure type safety.
    unrelated_type_equality_checks: warning

    # Treat missing required parameters as an error to ensure all required parameters are provided.
    missing_required_param: error

    # Treat missing return statements as an error to enforce explicit returns.
    missing_return: error

    # Allow having TODOs in code for better task management.
    todo: ignore

    # Treat reassignment of parameters as an error to prevent unintended side effects.
    parameter_assignments: ignore

    # Treat dependency reference issues as an error to prevent issues during publishing.
    depend_on_referenced_packages: error

    # Ignore warnings in included files to avoid unnecessary noise in analysis.
    included_file_warning: ignore

  exclude:
    # Exclude generated files from analysis to avoid unnecessary noise.
    - lib/generated_plugin_registrant.dart
    - test/.test_coverage.dart

linter:
  rules:
    # Avoid dynamic calls to ensure type safety.
    - avoid_dynamic_calls
    
    # Avoid redundant argument values for cleaner code.
    - avoid_redundant_argument_values
    
    # Avoid unused constructor parameters to reduce clutter.
    - avoid_unused_constructor_parameters
    
    # Enforce null safety for robustness.
    - enable_null_safety
    
    # Use Flutter style for TODOs.
    - flutter_style_todos
    
    # Ensure futures are handled correctly.
    - unawaited_futures
    
    # Avoid unnecessary breaks in switch cases.
    - unnecessary_breaks
    
    # Avoid unnecessary library directives.
    - unnecessary_library_directive
    
    # Avoid unnecessary parentheses for cleaner code.
    - unnecessary_parenthesis
    
    # Always declare return types for readability.
    - always_declare_return_types
    
    # Put required named parameters first for clarity.
    - always_put_required_named_parameters_first
    
    # Avoid bool literals in conditional expressions for readability.
    - avoid_bool_literals_in_conditional_expressions
    
    # Avoid checks for double and int for type safety.
    - avoid_double_and_int_checks
    
    # Avoid escaping inner quotes for cleaner strings.
    - avoid_escaping_inner_quotes
    
    # Avoid field initializers in const classes for immutability.
    - avoid_field_initializers_in_const_classes
    
    # Avoid final parameters as they can lead to immutability issues.
    - avoid_final_parameters
    
    # Avoid implementing value types for better design.
    - avoid_implementing_value_types
    
    # Avoid private typedef functions for readability.
    - avoid_private_typedef_functions
    
    # Avoid setters without getters for encapsulation.
    - avoid_setters_without_getters
    
    # Avoid type-to-string for better type handling.
    - avoid_type_to_string
    
    # Avoid void async for better async handling.
    - avoid_void_async
    
    # Cancel subscriptions to prevent memory leaks.
    - cancel_subscriptions
    
    # Cast nullable to non-nullable to prevent null errors.
    - cast_nullable_to_non_nullable
    
    # Reference comments properly for better documentation.
    - comment_references
    
    # Handle conditional URIs that do not exist.
    - conditional_uri_does_not_exist
    
    # Maintain consistency in deprecated usage.
    - deprecated_consistency
    
    # Describe all properties in diagnostics for better debugging.
    - diagnostic_describe_all_properties
    
    # Order directives for better organization.
    - directives_ordering
    
    # Ensure end of file has a newline.
    - eol_at_end_of_file
    
    # Avoid invariant booleans for better logic handling.
    - invariant_booleans
    
    # Avoid unrelated types in iterable contains checks.
    - iterable_contains_unrelated_type
    
    # Join return with assignment for better readability.
    - join_return_with_assignment
    
    # Avoid leading newlines in multiline strings for cleaner code.
    - leading_newlines_in_multiline_strings
    
    # Follow library naming conventions for consistency.
    - library_names
    
    # Avoid removing unrelated types from lists.
    - list_remove_unrelated_type
    
    # Avoid literal-only boolean expressions for clarity.
    - literal_only_boolean_expressions
    
    # Avoid adjacent strings in lists for cleaner code.
    - no_adjacent_strings_in_list
    
    # Avoid runtime type toString for better type handling.
    - no_runtimeType_toString
    
    # Avoid noop primitive operations for cleaner code.
    - noop_primitive_operations
    
    # Use prefixed library names for clarity.
    - package_prefixed_library_names
    
    # Use parameter assignments for better immutability.
    - parameter_assignments
    
    # Prefer asserts in initializer lists for better error handling.
    - prefer_asserts_in_initializer_lists
    
    # Prefer single quotes for string consistency.
    - prefer_single_quotes
    
    # Prefer relative imports for better module handling.
    - prefer_relative_imports
    
    # Prefer final in for-each loops for immutability.
    - prefer_final_in_for_each
    
    # Prefer foreach for better loop handling.
    - prefer_foreach
    
    # Prefer if elements in conditional expressions for clarity.
    - prefer_if_elements_to_conditional_expressions
    
    # Prefer null-aware method calls to avoid null errors.
    - prefer_null_aware_method_calls
    
    # Prefer void to null for better type safety.
    - prefer_void_to_null
    
    # Require trailing commas for cleaner diffs.
    - require_trailing_commas
    
    # Use sized box for shrink/expand to manage layout.
    - sized_box_shrink_expand
    
    # Sort unnamed constructors for better organization.
    - sort_unnamed_constructors_first
    
    # Test types in equals for better equality handling.
    - test_types_in_equals
    
    # Handle throw in finally for better error handling.
    - throw_in_finally
    
    # Tighten type of initializing formals for better type safety.
    - tighten_type_of_initializing_formals
    
    # Annotate public APIs for better readability.
    - type_annotate_public_apis
    
    # Avoid unnecessary await in returns for cleaner async code.
    - unnecessary_await_in_return
    
    # Avoid unnecessary lambdas for better performance.
    - unnecessary_lambdas
    
    # Avoid unnecessary null checks for cleaner code.
    - unnecessary_null_checks
    
    # Avoid unnecessary raw strings for cleaner code.
    - unnecessary_raw_strings
    
    # Avoid unnecessary statements for cleaner code.
    - unnecessary_statements
    
    # Use safe HTML to prevent security issues.
    - unsafe_html
    
    # Use colored box for better layout management.
    - use_colored_box
    
    # Use decorated box for better layout management.
    - use_decorated_box
    
    # Convert nulls to bool using if-null operator.
    - use_if_null_to_convert_nulls_to_bools
    
    # Use is-even rather than modulo for readability.
    - use_is_even_rather_than_modulo
    
    # Use named constants for better readability.
    - use_named_constants
    
    # Use raw strings for better readability.
    - use_raw_strings
    
    # Use setters to change properties for encapsulation.
    - use_setters_to_change_properties
    
    # Use string buffers for better performance.
    - use_string_buffers
    
    # Use test throws matchers for better test readability.
    - use_test_throws_matchers
    
    # Avoid annotating with dynamic for better type safety.
    - avoid_annotating_with_dynamic
    
    # Avoid classes with only static members for better design.
    - avoid_classes_with_only_static_members
    
    # Avoid equals and hash code on mutable classes for better design.
    - avoid_equals_and_hash_code_on_mutable_classes
    
    # Avoid returning null for better error handling.
    - avoid_returning_null
    
    # Avoid returning null for future for better async handling.
    - avoid_returning_null_for_future
    
    # Avoid returning this for better design.
    - avoid_returning_this
    
    # Avoid slow async IO for better performance.
    - avoid_slow_async_io
    
    # Use cascade invocations for cleaner code.
    - cascade_invocations
    
    # Handle environment variables properly.
    - do_not_use_environment
    
    # Ensure missing whitespace between adjacent strings.
    - missing_whitespace_between_adjacent_strings
    
    # Avoid default cases for better switch handling.
    - no_default_cases
    
    # Use one member abstracts for better design.
    - one_member_abstracts
    
    # Only throw errors for better error handling.
    - only_throw_errors
    
    # Document package APIs for better documentation.
    - package_api_docs
    
    # Prefer asserts with messages for better error handling.
    - prefer_asserts_with_message
    
    # Prefer expression function bodies for cleaner code.
    - prefer_expression_function_bodies
    
    # Prefer int literals for better readability.
    - prefer_int_literals
    
    # Prefer mixins for better code reuse.
    - prefer_mixin
    
    # Sort constructors first for better organization.
    - sort_constructors_first
    
    # Use late for private fields and variables for better initialization.
    - use_late_for_private_fields_and_variables
    
    # Use to and as if applicable for better type safety.
    - use_to_and_as_if_applicable
    
    # Reopen implicitly for better class management.
    - implicit_reopen
    
    # Handle invalid case patterns properly.
    - invalid_case_patterns
    
    # Ensure missing code block language in doc comment.
    - missing_code_block_language_in_doc_comment
    
    # Avoid self-assignments for cleaner code.
    - no_self_assignments
    
    # Use enums for better type safety.
    - use_enums
    
    # Handle deprecated member use from same package.
    - deprecated_member_use_from_same_package
    
    # Handle discarded futures properly.
    - discarded_futures
    
    # Ensure matching super parameters for better inheritance handling.
    - matching_super_parameters
    
    # Avoid literal bool comparisons for cleaner code.
    - no_literal_bool_comparisons
